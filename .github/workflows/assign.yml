name: Claim issue

# Contributors without write access cannot assign themselves. Commenting "/assign" on an issue
# that a maintainer has labelled `accepted` assigns it to the commenter. One task, one person.
on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  assign:
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.comment.body, '/assign') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const user = context.payload.comment.user.login;
            const labels = issue.labels.map((l) => l.name);
            const say = (body) => github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
            if (!labels.includes("accepted")) {
              return say(`@${user} this issue is not \`accepted\` yet, so it cannot be claimed. A maintainer will label it once the scope and licence questions are settled.`);
            }
            if (issue.assignees.length > 0) {
              return say(`@${user} this issue is already assigned to @${issue.assignees[0].login}.`);
            }
            await github.rest.issues.addAssignees({ ...context.repo, issue_number: issue.number, assignees: [user] });
            return say(`@${user} it is yours. Branch from \`main\`, follow CONTRIBUTING.md, and open a PR that says \`Closes #${issue.number}\`.`);
